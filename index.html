<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>열공장 타이쿤</title>
<meta name="description" content="열전달·수분전달 공식을 하나씩 해금하며 돈(J)을 버는 방치형 학습 게임">
<link rel="stylesheet" href="vendor/katex/katex.min.css">
<link rel="stylesheet" href="css/game.css">
</head>
<body>
<header class="topbar">
  <div class="brand">🔥 열공장 타이쿤 <small>공식을 해금해서 열을 팔자</small></div>
  <div class="wallet">
    <div class="money"><span class="lab">보유 열에너지</span><b id="moneyJ">0 J</b><span class="rate" id="rateJ">+0 W</span></div>
    <div class="money water hidden" id="waterBox"><span class="lab">💧 물</span><b id="moneyW">0 g</b><span class="rate" id="rateW">+0 g/s</span></div>
  </div>
  <div class="top-actions">
    <button id="btnDex">📖 공식 도감</button>
    <button id="btnHelp">❓ 방법</button>
  </div>
</header>

<main class="layout">
  <section class="stage-col">
    <div class="stage-card">
      <canvas id="stage"></canvas>
      <div class="stage-hint" id="stageHint">벽을 클릭하면 열이 넘어가요! 🔥 덩어리가 나타나면 차가운 쪽으로 끌어다 놓으세요.</div>
      <div class="click-info"><span>클릭 1회 = <b id="clickVal">1 J</b></span><span>배송 효율 η = <b id="etaVal">50%</b></span><span>전역 배수 <b id="multVal">×1.00</b></span></div>
    </div>
    <div class="next-card" id="nextCard"></div>
    <div class="log" id="log"></div>
  </section>
  <section class="cards-col" id="cards"></section>
</main>

<!-- 모달 -->
<div class="modal hidden" id="modal"><div class="modal-box"><button class="close" id="modalClose">✕</button><div id="modalBody"></div></div></div>
<div class="toast-wrap" id="toasts"></div>
<button class="bubble hidden" id="quizBubble">💡 공식 퀴즈!</button>
<button class="bubble bubble2 hidden" id="eventBubble"></button>

<script src="vendor/katex/katex.min.js"></script>
<script src="js/core.js"></script>
<script src="js/engine.js"></script>
<script src="js/game.js"></script>
</body>
</html>
